[project]
name = "python-cc"
version = "0.1.2"
description = "Pcc is a c compiler built on python and llvm."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
keywords = ["c", "compiler", "llvm", "ply"]
dependencies = [
    "llvmlite==0.46.0",
]

[project.scripts]
pcc = "pcc.cli_core:cli_main"
# Same compiler as `pcc`, but defaults to --python-libpython=off
# --ir-scaffold=on so produced binaries do not link libpython.
# Explicit --python-libpython / --ir-scaffold on the command line
# (or PCC_PYTHON_LIBPYTHON / PCC_IR_SCAFFOLD env vars) still win.
pcc-static = "pcc.cli_core:cli_main_strict_sys_argv_exit"

[project.urls]
Homepage = "https://github.com/jiamo/pcc"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["projects/", "c_tests/", "tests/"]

[tool.hatch.build.targets.wheel]
packages = ["pcc", "utils"]
# Make sure non-.py files needed by the runtime build / lazy first-run
# rebuild are part of the wheel. hatchling auto-includes the package
# directory tree, but we list these explicitly so future moves don't
# silently drop them.
include = [
    "pcc/py_runtime/src/**",
    "pcc/py_runtime/include/**",
    "pcc/py_runtime/py/**",
    "pcc/py_runtime/Makefile",
]

# Runtime archive is built at wheel-time by hatch_build.py using pcc
# itself (defaults to --backend self, no cc/clang). The hook drops
# libpy_runtime_pcc_py.a into the wheel via force_include if the build
# succeeds; otherwise the lazy first-run path in
# pcc.py_frontend.pipeline rebuilds it on the user's machine.
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
addopts = "-n auto -m 'not integration'"
markers = [
    "integration: expensive end-to-end integration tests excluded from the default test run",
]

[dependency-groups]
dev = [
    "click",
    "pytest>=9.0.2",
    "pytest-xdist>=3.8.0",
]
