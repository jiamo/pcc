    track: python/runtime/value-model
    title: "Make bytearray mutation preserve identity across aliases and calls"
    latest_update: "Discovered while moving worker assembly to .pco: py_bytearray_extend/append currently allocate and return a replacement object, while frontend lowering silently rebinds only a local Name receiver. A helper parameter that calls out.extend(...) therefore leaves the caller bytearray unchanged. The private .pco encoder now returns and rebinds its buffer explicitly; that is not a claim that Python bytearray semantics are complete."
    open_boundary: "Design identity-preserving bytearray storage with length/capacity and GC-safe growth, or an equivalent indirection whose object identity never changes. Cover extend, append, insert, slice assignment/deletion, aliasing through parameters/containers/attributes, memoryview export/resize restrictions, exceptions and all five collectors. Remove frontend receiver-rebind compensation only after the runtime owns mutation semantics."
    scope_limit: "Generic Python bytearray identity/mutation semantics only. No call-site/module-name special case, silent replacement visible through aliases, unsafe realloc of a GC-managed object, memoryview invalidation, or weakening of ordinary mutable-object identity."
    baseline_metric: "A bytearray passed to a helper remains unchanged after helper(buf).extend(payload); current runtime helpers return a new object and only direct Name calls appear to work because codegen rebinds that local."
    success_threshold: "All bytearray mutators return CPython-compatible values and mutate the one original object observed by every alias; exported memoryviews enforce resize rules; C and pcc-Python mirrors are differential-equal under GC0..4 and long-running growth does not leak or retain obsolete buffers."
    failure_disposition: "Keep the explicit pure-return adapter at private compiler call sites while this row is open. Never claim bytearray parity from direct-local tests that let frontend rebinding hide identity replacement."
    baseline_evidence: docs/investigations/native-binary-file-write-byteslike.md
