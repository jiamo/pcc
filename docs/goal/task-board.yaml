    latest_update: "2026-08-25 FIXED. Root cause: every GC frame enter and leave published a tracing-work request, which is right for a mutator but wrong for the collector, because this runtime is compiled pcc-Python so every call inside pcc_gc_collect drain loop enters and leaves a GC frame. The collector re-armed the request it had just cleared, so completing a cycle immediately requested the next one. Measured with the world stopped: req went 0 -> 1 across the completing step and the gray count oscillated 0 -> 3 -> 0 forever, both halves reporting progress; after the fix req stays 0 and the drain terminates in two steps. C never hit this because it requests a cycle on SCHEDULER-ROOT mutation, not frame transitions, and its collector is C so it registers no frames - a structural difference, so no C change was made rather than adding a guard that could never fire. Fix: the four frame-registry request sites skip the request while pcc_gc_explicit_collect_active is set; inlined because freestanding modules require c_abi_export on every function. Gates: both previously hanging arms pass (1.86s and 1.36s, from 60s timeouts), all 10 strict arms pass, 31 other collect probes pass. Wrong turns recorded in the evidence: I guarded the object allocator first and it measured null (reverted immediately) because my grep had missed the store_release spelling."
