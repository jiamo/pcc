    open_boundary: "eq=False dataclasses are not honored anywhere in the expansion (pre-existing: __eq__ is synthesized regardless), so the CPython rule frozen+eq=False -> inherited identity hash is untestable until eq= parsing exists - same boundary as the expansion itself. unsafe_hash unsupported. Bootstrap residue rides the consolidation runbook (class_gen compiles into pcc1)."
