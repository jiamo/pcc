  - id: BUILD-P0-BOOTSTRAP-STDLIB-REACHABILITY-CLOSURE
    priority: P0
    status: TODO_READY
    track: self-host/stdlib/ownership/performance
    title: "Keep the bootstrap compiler closure minimal while compiling supported stdlib modules on demand"
    latest_update: "Explicit human requirement: pcc1 must retain the ability to compile supported Python/stdlib imports, but the compiler bootstrap artifact must not eagerly embed every standard-library module. 2026-08-31 current contextual reachability fell 225->224 after the direct pcc1 worker stopped importing pcc.backend.macho_assemble_worker, a host process-pool wrapper; arm64_asm_driver/native_object remain reachable and the 224-module zero-fallback gate passes. This is one classified removal, not the complete manifest or on-demand stdlib proof."
    open_boundary: "Inventory every module currently admitted to the pcc1 bootstrap closure and classify it as compiler-reachable, runtime-reachable, diagnostic-only or accidentally retained. Make pcc1 contain only the compiler/runtime closure needed to compile programs; compile and cache supported stdlib modules from the user program's resolved import closure, with target/compiler/runtime/backend/GC provenance, deterministic ordering and an explicit fail-closed diagnostic for unsupported or unresolved dynamic imports. Prove both a cold build and a warm reuse without host Python/libpython ownership."
    scope_limit: "Bootstrap reachability, supported-stdlib import closure, artifact provenance and distribution policy only. This row does not promise that every CPython stdlib API is already implemented, remove deliberately required compiler/runtime providers, precompile the whole stdlib into pcc1, special-case module names, silently execute an unsupported module under CPython, or replace the separate STDLIB-P1-BUILD-TOOL-CLOSURE API-coverage row."
    baseline_metric: "The compiler closure grew from 219 to 225 modules when six native-object/ARM64 backend providers became reachable, then fell to 224 when the host-only macho_assemble_worker wrapper left the pcc1 graph. No retained receipt proves that every remaining module is necessary or that a supported stdlib module excluded from pcc1 can be compiled, cached and linked on demand by pcc1."
    success_threshold: "A machine-readable reachability manifest accounts for every module embedded in pcc1; unreachable stdlib modules are absent from the bootstrap binary; two generic supported stdlib canaries outside the bootstrap closure compile and run through cold and warm import-closure builds with exact provenance and zero host/libpython/LLVM fallback; pcc1 remains able to compile those modules without making them permanent compiler payload."
    failure_disposition: "Missing compiler/runtime providers fail at the closure gate and must be restored by generic reachability. Unsupported/dynamic imports fail closed with a stable capability diagnostic. Never obtain a smaller pcc1 by deleting reachable semantics, and never obtain import success by embedding the entire stdlib or invoking a host interpreter."
