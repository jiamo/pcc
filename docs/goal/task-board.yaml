the 19-function Stage2 rejection is closed. A cold Stage2+Stage3 is running under a watchdog. Original finding: ROOT CAUSE of the Stage2 blocker, reproduced in 8 lines and in pure Python. Adding six negative multiples of 8 to a set gives len 5 under pcc and len 6 under CPython; positive multiples of the same shape and small negatives are all correct. n=6 is exactly where a capacity-8 set grows (threshold = (capacity*2)//3 = 5). The add path uses CPython's perturb recurrence j = (j*5 + perturb + 1) & mask with NO linear-probe window, and for these keys at capacity 8 the sequence visits only {0,1,3,6,7} - oscillating 7,3,7,3 - while slots 2, 4 and 5 stay free and unvisited. The while probes < capacity*2 budget then runs out and the element is dropped WITH NO ERROR. Both the pcc-Python port and the C mirror have it (PCC_RUNTIME_CC=cc reproduces identically), so it is an original shared defect, not port drift, and it is invisible to host pcc because host pcc uses CPython's own set. Frame offsets are negative and pointer-aligned, i.e. exactly this shape, which is why active_offsets lost -32 and 19 functions were rejected."
