  - id: M5-SELFHOST-BIG-INT-LITERAL
    priority: P0
    status: TODO_READY
    track: self-host/semantics
    title: "Fix integer literals above the tagged lane evaluating to 0 in pcc-compiled code"
    latest_evidence: ""
    latest_update: "2026-08-18 root cause of pcc2 being unable to print any integer. A *literal* int constant above the tagged small-int lane evaluates to 0 in pcc-compiled code, while the same value computed is correct. Probed with a pcc1-built binary: `1 << 63` -> 9223372036854775808 correct, `(1 << 64) - 1` -> 18446744073709551615 correct, but the decimal literal 9223372036854775808 -> 0 and 0xFFFFFFFFFFFFFFFF -> 0. This silently zeroed a mask in _emit_int_literal_object, so every int literal lowered to a NULL pointer under pcc2. All 13 over-lane literals in pcc/py_frontend and pcc/backend were rewritten as equivalent expressions and tests/python/test_selfhost_no_over_lane_int_literals.py now keeps new ones out, but the compiler defect itself is unfixed."
    open_boundary: "BLOCKER PRECISELY IDENTIFIED, not fixed: `_int_exprs_are_boxed()` is False under --ir-scaffold=on --python-libpython=off, the mode pcc1 is built in, so `int` values are native i64 there and `_maybe_emit_exact_int_object` is never reached -- compiling pcc/parse/py_lift.py in that mode produces zero emit_int_builtin_as_object calls. Every object-projection fix therefore applies to host-compiled user programs but not to pcc1 compiling itself, which is why mimic programs kept passing while pcc1 stayed at 0. Closing this needs the admission decision (an int with unbounded range demoted to the object projection in this mode), i.e. INT-P0-PROJ, a mode-level change. LANDED and pcc1-verified meanwhile: runtime int(str) for dec/hex x base0/base10, int-typed field reads, and field values re-wrapped through int(), plus a runtime py_obj_as_int_object(o, base) with its port mirror. DENIED: building the Dyn dispatch in the frontend -- it creates blocks and a phi inside a probe whose result callers may discard, which orphans them and broke stage1 (isolated: exit 0 disabled, exit 1 enabled)."
    milestone: M5
    depends_on: []
    rank: 9500
    exit_criteria:
      - "A pcc1-compiled program prints large decimal and hex int literals correctly, including 2**63, 2**64-1, and their negatives."
      - "A freestanding --python-library reproducer returns a heap object from inside a loop in a @c_abi_export function and the caller receives it intact."
      - "The exact failing threshold is identified and recorded, and the defect is fixed at its source rather than worked around at call sites."
      - "The over-lane literal lint still passes, and the sweep is extended to pcc/py_runtime/py."
    required_gates:
      - "gtimeout 300s env -u LC_ALL uv run pytest -q -x -n0 tests/python/test_selfhost_no_over_lane_int_literals.py"
      - "gtimeout 900s env -u LC_ALL uv run pytest -q -x -n0 tests/python/test_pcc1_emits_native_function_binary.py"
