  - id: M5-SELFHOST-DATACLASS-TUPLE-EQ
    priority: P1
    status: TODO_READY
    track: self-host/semantics
    title: "Fix tuple-of-frozen-dataclass equality answering False under pcc1"
    latest_evidence: ""
    latest_update: "2026-08-18 found while removing the stage2 emit bottleneck: pcc1 answers `(L(1,True),L(2,False)) == (L(1,True),L(2,False))` as False for a frozen dataclass L, where the host answers True. In render_aarch64_stack_map_section this only cost performance (31946 of 38540 records fell back to building and hashing a ~2 kB key string), and that call site now tests identity first. The underlying compiler defect is unfixed and is a CORRECTNESS risk anywhere else that compares dataclass tuples by value."
