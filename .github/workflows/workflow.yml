name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  # Publication is not gated on the truth matrix: the head-truth light/heavy
  # workflows were removed (owner ruling 2026-07-25) because a 115-minute
  # macOS matrix made releases unusable and blocked them outright on any red
  # gate. The gate runner itself (scripts/head_truth_gate.py) is unchanged and
  # is run locally.
  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: pip install build

      - name: Build sdist
        # sdist-only: hatch_build.py self-compiles a native `pcc` on
        # every user's `pip install`, so no platform wheels are
        # published. See pyproject.toml + hatch_build.py.
        run: python -m build --sdist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
