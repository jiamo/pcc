name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  # The heavy five-GC fixed-point matrix is NOT a release blocker: it needs up
  # to 115 minutes on a macOS runner, so gating publication on it made releases
  # unusable. It keeps running on its own daily schedule and on demand
  # (head-truth-heavy.yml: schedule + workflow_dispatch), and the light
  # ratchets run on every push (head-truth-light.yml).
  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install build

      - name: Build sdist
        # sdist-only: hatch_build.py self-compiles a native `pcc` on
        # every user's `pip install`, so no platform wheels are
        # published. See pyproject.toml + hatch_build.py.
        run: python -m build --sdist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
