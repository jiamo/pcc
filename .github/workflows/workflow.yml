name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  head-truth:
    uses: ./.github/workflows/head-truth-heavy.yml

  pypi-publish:
    name: Upload release to PyPI
    needs: head-truth
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install build

      - name: Build sdist
        # sdist-only: hatch_build.py self-compiles a native `pcc` on
        # every user's `pip install`, so no platform wheels are
        # published. See pyproject.toml + hatch_build.py.
        run: python -m build --sdist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
